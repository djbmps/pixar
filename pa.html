<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Portfolio วPA · นางสาวดวงใจ บุญมีประเสริฐ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#12315c; --navy2:#1b4785; --teal:#0f9b8e; --teal2:#14b8a6;
  --gold:#d99a2b; --ink:#1e293b; --muted:#64748b; --line:#e2e8f0;
  --bg:#f5f7fb; --card:#ffffff; --soft:#eef4fb;
  --radius:16px; --shadow:0 2px 14px rgba(18,49,92,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.72;font-size:16px}
img{max-width:100%}
a{color:var(--navy2)}
button{font-family:inherit}

/* ---------- Topbar ---------- */
.topbar{background:linear-gradient(115deg,var(--navy) 0%,var(--navy2) 55%,#215ba8 100%);color:#fff;padding:14px 20px}
.topbar-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:240px}
.brand-badge{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:22px;flex:none}
.brand h1{font-size:1.02rem;font-weight:700;line-height:1.35}
.brand p{font-size:.8rem;opacity:.85}
.topbtn{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);padding:8px 16px;border-radius:10px;cursor:pointer;font-size:.85rem;font-weight:500;white-space:nowrap}
.topbtn:hover{background:rgba(255,255,255,.28)}
.topbtn.on{background:var(--teal2);border-color:var(--teal2)}

/* ---------- Nav ---------- */
.nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;box-shadow:0 1px 6px rgba(0,0,0,.04)}
.nav-in{max-width:1180px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;padding:0 10px;scrollbar-width:thin}
.nav-in::-webkit-scrollbar{height:4px}
.nav-in::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
.navbtn{background:none;border:none;border-bottom:3px solid transparent;padding:13px 14px;cursor:pointer;font-size:.9rem;color:var(--muted);white-space:nowrap;font-weight:500;display:flex;align-items:center;gap:6px}
.navbtn:hover{color:var(--navy2);background:var(--soft)}
.navbtn.active{color:var(--navy2);border-bottom-color:var(--teal);font-weight:600}

/* ---------- Layout ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:26px 18px 70px}
.page{display:none}
.page.show{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

h2.pt{font-size:1.4rem;color:var(--navy);margin-bottom:4px;font-weight:700}
p.ps{color:var(--muted);font-size:.9rem;margin-bottom:20px}
h3.st{font-size:1.08rem;color:var(--navy2);margin:26px 0 12px;padding-left:12px;border-left:4px solid var(--teal);font-weight:600}
h3.st:first-child{margin-top:0}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}

/* ---------- Hero ---------- */
.hero{background:linear-gradient(125deg,var(--navy) 0%,var(--navy2) 60%,#2a6cc0 100%);color:#fff;border-radius:20px;padding:32px;margin-bottom:22px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-70px;top:-70px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero-in{display:flex;gap:28px;align-items:center;flex-wrap:wrap;position:relative;z-index:1}
.hero-photo{width:150px;height:186px;border-radius:14px;object-fit:cover;background:rgba(255,255,255,.14);border:3px solid rgba(255,255,255,.3);flex:none}
.hero-photo.ph{display:grid;place-items:center;font-size:54px;color:rgba(255,255,255,.6)}
.hero-txt{flex:1;min-width:260px}
.hero-kicker{display:inline-block;background:rgba(255,255,255,.18);padding:5px 14px;border-radius:99px;font-size:.78rem;margin-bottom:12px}
.hero-txt h2{font-size:1.75rem;font-weight:700;line-height:1.3}
.hero-txt .pos{font-size:1rem;opacity:.95;margin-top:4px}
.hero-txt .org{font-size:.86rem;opacity:.8;margin-top:2px}
.hero-round{margin-top:14px;font-size:.86rem;background:rgba(0,0,0,.16);display:inline-block;padding:6px 14px;border-radius:10px}
.hero-vision{margin-top:14px;font-size:.92rem;font-style:italic;opacity:.94;border-left:3px solid var(--teal2);padding-left:12px}

.challenge-banner{background:linear-gradient(100deg,#0f9b8e,#14b8a6);color:#fff;border-radius:16px;padding:22px 24px;margin-bottom:20px}
.challenge-banner .lb{font-size:.8rem;opacity:.9;letter-spacing:.04em}
.challenge-banner .tt{font-size:1.08rem;font-weight:600;margin-top:6px;line-height:1.6}

/* ---------- Stats ---------- */
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;text-align:center;box-shadow:var(--shadow);position:relative}
.stat .v{font-size:1.9rem;font-weight:700;color:var(--navy2);line-height:1.2}
.stat .u{font-size:.8rem;color:var(--teal);font-weight:600}
.stat .l{font-size:.84rem;color:var(--muted);margin-top:4px}

/* ---------- Quick cards ---------- */
.qc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;text-align:left;width:100%;box-shadow:var(--shadow);transition:.15s}
.qc:hover{transform:translateY(-3px);border-color:var(--teal);box-shadow:0 8px 20px rgba(18,49,92,.1)}
.qc .ic{font-size:24px}
.qc .t{font-weight:600;color:var(--navy);margin-top:8px;font-size:.98rem}
.qc .d{font-size:.82rem;color:var(--muted);margin-top:3px}

/* ---------- Timeline ---------- */
.tl{position:relative;padding-left:26px}
.tl::before{content:'';position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-i{position:relative;padding-bottom:18px}
.tl-i::before{content:'';position:absolute;left:-24px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--teal);border:2px solid #fff;box-shadow:0 0 0 2px var(--teal)}
.tl-d{font-size:.78rem;color:var(--teal);font-weight:600}
.tl-t{font-weight:600;color:var(--navy)}
.tl-x{font-size:.88rem;color:var(--muted)}

/* ---------- Tables ---------- */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:.88rem;min-width:620px}
th{background:var(--soft);color:var(--navy);text-align:left;padding:11px 13px;font-weight:600;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:11px 13px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafcff}

/* ---------- Work / evidence cards ---------- */
.work{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);margin-bottom:16px}
.work-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;background:linear-gradient(90deg,#fbfdff,#fff)}
.work-h .wt{flex:1;font-weight:600;color:var(--navy);font-size:1.02rem}
.code{background:var(--navy);color:#fff;font-size:.72rem;padding:3px 9px;border-radius:6px;font-weight:600;white-space:nowrap;letter-spacing:.03em}
.chip{background:var(--soft);color:var(--navy2);font-size:.75rem;padding:3px 10px;border-radius:99px;border:1px solid #d7e5f7;white-space:nowrap}
.work-b{padding:16px 20px}
.fld{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;padding:7px 0;border-bottom:1px dashed #eef2f7;font-size:.9rem}
.fld:last-child{border-bottom:none}
.fld .k{color:var(--muted);font-weight:500}
.fld .v{white-space:pre-wrap}
.oo{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-top:12px}
.oo>div{background:var(--soft);border-radius:10px;padding:12px;font-size:.86rem}
.oo .lb{font-size:.74rem;color:var(--teal);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.media{margin-top:14px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#f8fafc}
.media img{display:block;width:100%}
.media iframe{display:block;width:100%;height:330px;border:none}
.cap{font-size:.8rem;color:var(--muted);padding:8px 12px;background:#fff;border-top:1px solid var(--line)}
.work-f{padding:12px 20px;background:#fbfdff;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- Buttons ---------- */
.btn{background:var(--navy2);color:#fff;border:none;padding:9px 18px;border-radius:10px;cursor:pointer;font-size:.87rem;font-weight:500;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--navy)}
.btn.t{background:var(--teal)}.btn.t:hover{background:#0b8378}
.btn.g{background:#fff;color:var(--navy2);border:1px solid var(--line)}.btn.g:hover{background:var(--soft)}
.btn.r{background:#fff;color:#dc2626;border:1px solid #fecaca}.btn.r:hover{background:#fef2f2}
.btn.sm{padding:5px 11px;font-size:.78rem;border-radius:8px}
.btn:disabled{opacity:.55;cursor:not-allowed}

/* ---------- Filters ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.inp{padding:9px 13px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:.9rem;background:#fff;color:var(--ink)}
.inp:focus{outline:2px solid #bfdbfe;border-color:var(--navy2)}
select.inp{cursor:pointer}

/* ---------- Empty / edit ---------- */
.empty{text-align:center;padding:34px 20px;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:var(--radius);font-size:.9rem}
.editbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ebtn{background:#fff;border:1px solid var(--line);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:.82rem;display:grid;place-items:center;color:var(--muted)}
.ebtn:hover{background:var(--soft);color:var(--navy2);border-color:#c7d9f0}
.ebtn.del:hover{background:#fef2f2;color:#dc2626;border-color:#fecaca}
.addrow{margin:10px 0 22px}
.editing-on .edit-only{display:inline-flex}
.edit-only{display:none}

/* ---------- Modal ---------- */
.mask{display:none;position:fixed;inset:0;background:rgba(15,30,55,.55);z-index:100;padding:18px;overflow-y:auto}
.mask.show{display:block}
.modal{background:#fff;border-radius:18px;max-width:760px;margin:26px auto;box-shadow:0 24px 60px rgba(0,0,0,.28)}
.modal.sm{max-width:420px}
.mh{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.mh h3{font-size:1.1rem;color:var(--navy);flex:1;font-weight:600}
.mb{padding:20px 22px;max-height:66vh;overflow-y:auto}
.mf{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.frm label{display:block;margin-bottom:13px}
.frm .lb{display:block;font-size:.84rem;color:var(--navy2);font-weight:600;margin-bottom:5px}
.frm .hint{font-size:.76rem;color:var(--muted);font-weight:400}
.frm input,.frm textarea,.frm select{width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:.92rem;color:var(--ink);background:#fff}
.frm textarea{min-height:82px;resize:vertical;line-height:1.7}
.frm input:focus,.frm textarea:focus,.frm select:focus{outline:2px solid #bfdbfe;border-color:var(--navy2)}
.prev{margin-top:8px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.prev img{display:block;width:100%}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(90px);background:var(--navy);color:#fff;padding:11px 22px;border-radius:99px;font-size:.88rem;z-index:200;transition:.28s;box-shadow:0 8px 24px rgba(0,0,0,.24);opacity:0}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

.foot{text-align:center;color:var(--muted);font-size:.82rem;padding:26px 18px 40px;border-top:1px solid var(--line);margin-top:30px;background:#fff}
.upd{font-size:.8rem;color:var(--muted);text-align:right;margin-bottom:10px}

.subnav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.subbtn{background:#fff;border:1px solid var(--line);padding:8px 16px;border-radius:99px;cursor:pointer;font-size:.87rem;color:var(--muted);font-weight:500}
.subbtn.active{background:var(--navy2);color:#fff;border-color:var(--navy2)}

.checklist li{margin-left:20px;font-size:.9rem;padding:3px 0}
.note{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:14px 16px;font-size:.87rem;color:#78350f;margin-bottom:16px}

@media(max-width:640px){
  body{font-size:15px}
  .wrap{padding:18px 13px 60px}
  .hero{padding:22px 18px}
  .hero-photo{width:112px;height:140px}
  .hero-txt h2{font-size:1.35rem}
  .fld{grid-template-columns:1fr;gap:2px}
  .fld .k{font-size:.8rem}
  .modal{margin:0 auto}
  .mb{max-height:72vh}
}
@media print{
  .nav,.topbar,.editbar,.addrow,.mask,.toast,.btn,.subnav,.filters{display:none!important}
  .page{display:block!important}
  body{background:#fff}
  .card,.work{break-inside:avoid;box-shadow:none}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="brand-badge">🎓</div>
      <div>
        <h1 id="tbTitle">E-Portfolio วPA</h1>
        <p id="tbSub">ข้อตกลงในการพัฒนางาน · ตำแหน่งศึกษานิเทศก์</p>
      </div>
    </div>
    <button class="topbtn edit-only" onclick="openConfig()">⚙️ ตั้งค่าเว็บ</button>
    <button class="topbtn" id="loginBtn" onclick="openLogin()">🔐 เข้าสู่ระบบ</button>
  </div>
</div>

<nav class="nav"><div class="nav-in" id="navIn"></div></nav>

<div class="wrap">
  <div class="upd" id="updAt"></div>
  <div id="pages"></div>
</div>

<div class="foot" id="foot"></div>

<!-- ===== Login modal ===== -->
<div class="mask" id="loginMask">
  <div class="modal sm">
    <div class="mh"><h3>🔐 เข้าสู่ระบบเจ้าของแฟ้ม</h3></div>
    <div class="mb frm">
      <p style="font-size:.86rem;color:var(--muted);margin-bottom:14px">ผู้เยี่ยมชมทั่วไปดูข้อมูลได้โดยไม่ต้องเข้าสู่ระบบ — เข้าสู่ระบบเฉพาะเมื่อต้องการแก้ไขเนื้อหา</p>
      <label><span class="lb">ชื่อผู้ใช้</span><input id="lgUser" autocomplete="username"></label>
      <label><span class="lb">รหัสผ่าน</span><input id="lgPass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></label>
      <div id="lgErr" style="color:#dc2626;font-size:.85rem"></div>
    </div>
    <div class="mf">
      <button class="btn g" onclick="closeM('loginMask')">ยกเลิก</button>
      <button class="btn" onclick="doLogin()">เข้าสู่ระบบ</button>
    </div>
  </div>
</div>

<!-- ===== Item modal ===== -->
<div class="mask" id="itemMask">
  <div class="modal">
    <div class="mh"><h3 id="imTitle">แก้ไขรายการ</h3></div>
    <div class="mb frm" id="imBody"></div>
    <div class="mf">
      <button class="btn r" id="imDel" onclick="delItem()">🗑 ลบ</button>
      <span style="flex:1"></span>
      <button class="btn g" onclick="closeM('itemMask')">ยกเลิก</button>
      <button class="btn t" id="imSave" onclick="saveItem()">💾 บันทึก</button>
    </div>
  </div>
</div>

<!-- ===== Config modal ===== -->
<div class="mask" id="cfgMask">
  <div class="modal">
    <div class="mh"><h3>⚙️ ตั้งค่าข้อมูลหลักของเว็บ</h3></div>
    <div class="mb frm" id="cfgBody"></div>
    <div class="mf">
      <button class="btn g" onclick="closeM('cfgMask')">ยกเลิก</button>
      <button class="btn t" onclick="saveConfig()">💾 บันทึก</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   E-Portfolio วPA — frontend (single file)
   ========================================================= */
const API_URL = "https://script.google.com/macros/s/AKfycbwfURsePJ4vLjxPiY2AZcDnMZ90ylq6CuVaEsGoih7XnUacllrLhqj7OPcoQkBSg-gvRg/exec";

let CFG = {}, ITEMS = [], ME = null, PAGE = 'home', SUB = {};
const PAGES = {};   // ประกาศไว้ก่อน เพราะ boot() เรียกใช้ตั้งแต่ต้นไฟล์

/* ---------- โครงสร้างเมนู 8 เมนู ---------- */
const MENU = [
  ['home',      '🏠', 'หน้าแรก',                     'ภาพรวมผู้รับการประเมินและผลงานสำคัญ'],
  ['profile',   '👤', 'ข้อมูลผู้รับการประเมิน',        'ประวัติ ตำแหน่ง และภาระงาน'],
  ['pa',        '📋', 'ข้อตกลง (PA)',                 'เป้าหมาย ตัวชี้วัด และผลลัพธ์ที่คาดหวัง'],
  ['perf',      '📈', 'ผลการปฏิบัติงาน',              'ผลงานตามมาตรฐานตำแหน่ง 3 ด้าน'],
  ['challenge', '🎯', 'ประเด็นท้าทาย',                 'ปัญหา วิธีดำเนินการ และผลลัพธ์'],
  ['impact',    '🌱', 'ผลลัพธ์และผลกระทบ',            'ผลที่เกิดกับครู สถานศึกษา ผู้เรียน'],
  ['evidence',  '🗂️', 'คลังหลักฐาน',                  'หลักฐานทั้งหมดพร้อมรหัสอ้างอิง'],
  ['summary',   '📥', 'สรุปผลและดาวน์โหลด',           'ตารางสรุปและเอกสารฉบับเต็ม']
];

/* ---------- ด้านตามมาตรฐานตำแหน่ง ---------- */
const DIMS = [
  ['s1d1','ด้านที่ 1 การนิเทศการศึกษา'],
  ['s1d2','ด้านที่ 2 การส่งเสริมและสนับสนุนการจัดการศึกษา'],
  ['s1d3','ด้านที่ 3 การพัฒนาตนเองและวิชาชีพ']
];
const IMPACTS = [
  ['impact.teacher','👩‍🏫','ผลที่เกิดกับครู'],
  ['impact.school','🏫','ผลที่เกิดกับสถานศึกษา'],
  ['impact.student','🧒','ผลที่เกิดกับผู้เรียน'],
  ['impact.org','🏛️','ผลที่เกิดกับหน่วยงานและวิชาชีพ']
];
const PROFILE_GROUPS = [
  ['profile.personal','ข้อมูลส่วนตัวและตำแหน่ง'],
  ['profile.education','ประวัติการศึกษา'],
  ['profile.career','ประวัติการรับราชการ'],
  ['profile.duty','หน้าที่และภาระงาน'],
  ['profile.area','กลุ่มโรงเรียน / พื้นที่ที่รับผิดชอบ'],
  ['profile.contact','ช่องทางติดต่อทางราชการ'],
  ['profile.award','รางวัลและการยอมรับ']

/* =========================================================
   Utilities
   ========================================================= */
const $ = id => document.getElementById(id);
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function nl(s){ return esc(s).replace(/\n/g,'<br>'); }
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2600); }
function closeM(id){ $(id).classList.remove('show'); }
function canEdit(){ return ME && ME.role === 'owner'; }
function cred(){ return ME ? { user: ME.user, password: ME.password } : {}; }
function parseMeta(m){ if(!m) return {}; try { return typeof m==='string' ? JSON.parse(m) : m; } catch(e){ return {}; } }

function items(section){
  return ITEMS.filter(i => String(i.section) === section)
              .sort((a,b) => (Number(a.sort)||0) - (Number(b.sort)||0));
}

async function api(action, payload){
  const body = Object.assign({ action }, payload || {});
  const r = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body) });
  return r.json();
}

/* ---------- ฝังสื่อจากลิงก์ ---------- */
function mediaEmbed(url){
  if (!url) return '';
  const u = String(url).trim();
  if (u.indexOf('data:image') === 0) return `<div class="media"><img src="${esc(u)}" alt=""></div>`;
  let m = u.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([\w-]{11})/);
  if (m) return `<div class="media"><iframe src="https://www.youtube.com/embed/${m[1]}" allowfullscreen loading="lazy"></iframe></div>`;
  m = u.match(/drive\.google\.com\/file\/d\/([\w-]+)/) || u.match(/[?&]id=([\w-]+)/);
  if (m) return `<div class="media"><iframe src="https://drive.google.com/file/d/${m[1]}/preview" allowfullscreen loading="lazy"></iframe></div>`;
  if (/\.(png|jpe?g|gif|webp)(\?|$)/i.test(u)) return `<div class="media"><img src="${esc(u)}" alt="" loading="lazy"></div>`;
  if (/\.mp4(\?|$)/i.test(u)) return `<div class="media"><video src="${esc(u)}" controls style="width:100%;display:block"></video></div>`;
  return '';
}
function linkBtn(url, label){
  if (!url) return '';
  return `<a class="btn g sm" href="${esc(url)}" target="_blank" rel="noopener">🔗 ${esc(label||'เปิดหลักฐาน')}</a>`;
}

/* =========================================================
   Boot
   ========================================================= */
function boot(){
  try {
    const c = localStorage.getItem('pa_cache_v2');
    if (c){ const d = JSON.parse(c); CFG = d.config||{}; ITEMS = d.items||[]; }
    const s = localStorage.getItem('pa_me_v2');
    if (s) ME = JSON.parse(s);
  } catch(e){}
  if (location.hash && location.hash.length > 1){
    const h = location.hash.slice(1);
    if (MENU.some(m => m[0] === h)) PAGE = h;
  }
  renderAll();
  load();
}

async function load(){
  try {
    const r = await fetch(API_URL + '?action=getPA&t=' + Date.now());
    const d = await r.json();
    if (d && d.ok){
      CFG = d.config || {};
      ITEMS = d.items || [];
      try { localStorage.setItem('pa_cache_v2', JSON.stringify({ config: CFG, items: ITEMS })); } catch(e){}
      renderAll();
    }
  } catch(e){ console.warn('load failed', e); }
}

function renderAll(){
  document.body.classList.toggle('editing-on', !!canEdit());

  $('tbSub').textContent = (CFG.ownerName || '') + (CFG.ownerPosition ? ' · ' + CFG.ownerPosition : '');

async function uploadImg(input){
  const f = input.files && input.files[0]; if (!f) return;
  toast('กำลังย่อขนาดภาพ…');
  try {
    const data = await compress(f, 1400);
    EDIT.media = data;
    $('mvPrev').innerHTML = `<div class="prev"><img src="${data}"></div><button type="button" class="btn r sm" style="margin-top:8px" onclick="clearImg()">ลบภาพนี้</button>`;
    toast('เตรียมภาพแล้ว — กดบันทึกเพื่อจัดเก็บ');
  } catch(e){ toast('อ่านไฟล์ภาพไม่สำเร็จ'); }
  input.value = '';
}
function clearImg(){ EDIT.media=''; $('mvPrev').innerHTML=''; }
function compress(file, maxDim){
  return new Promise((res, rej)=>{
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        const sc = Math.min(1, maxDim / Math.max(w,h));
        w = Math.round(w*sc); h = Math.round(h*sc);
        const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        let q = 0.82, out = cv.toDataURL('image/jpeg', q);
        while (out.length > 45000 && q > 0.25){ q -= 0.1; out = cv.toDataURL('image/jpeg', q); }
        if (out.length > 45000){
          const cv2 = document.createElement('canvas');
          cv2.width = Math.round(w*0.6); cv2.height = Math.round(h*0.6);
          cv2.getContext('2d').drawImage(img,0,0,cv2.width,cv2.height);
          out = cv2.toDataURL('image/jpeg', 0.6);
        }
        res(out);
      };
      img.onerror = rej; img.src = fr.result;
    };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

async function saveItem(){
  if (!canEdit()) return;
  const spec = formSpec(EDIT.section);
  const payload = Object.assign({ section: EDIT.section, media: EDIT.media }, cred());
  const meta = {};
  spec.forEach(f=>{
    if (f.t === 'media') return;
    const el = $('f_'+f.k); if (!el) return;
    if (f.k.indexOf('m_') === 0) meta[f.k] = el.value;
    else payload[f.k] = el.value;
  });
  if (Object.keys(meta).length) payload.meta = meta;
  if (!String(payload.title||'').trim() && !String(payload.code||'').trim()){ toast('กรุณากรอกชื่อรายการ'); return; }

  $('imSave').disabled = true; $('imSave').textContent = 'กำลังบันทึก…';
  try {
    let d;
    if (EDIT.id){ payload.id = EDIT.id; d = await api('updateItem', payload); }
    else d = await api('addItem', payload);
    if (d && d.ok){ closeM('itemMask'); await load(); toast('บันทึกแล้ว'); }
    else toast((d && d.error) || 'บันทึกไม่สำเร็จ');
  } catch(e){ toast('เชื่อมต่อไม่ได้'); }
  $('imSave').disabled = false; $('imSave').textContent = '💾 บันทึก';
}

  if (!canEdit()) return;
  const entries = {};
  CFG_FIELDS.forEach(([k])=>{ const el = $('c_'+k); if (el) entries[k] = el.value; });
  if (CFGPHOTO !== null) entries.photo = CFGPHOTO;
  const d = await api('saveConfig', Object.assign({ entries }, cred()));
  if (d && d.ok){ closeM('cfgMask'); await load(); toast('บันทึกการตั้งค่าแล้ว'); }
  else toast((d && d.error) || 'บันทึกไม่สำเร็จ');
}

/* ปิด modal เมื่อคลิกพื้นหลัง */
document.querySelectorAll('.mask').forEach(m=>{
  m.addEventListener('click', e=>{ if (e.target === m) m.classList.remove('show'); });
});
document.addEventListener('keydown', e=>{ if (e.key === 'Escape') document.querySelectorAll('.mask.show').forEach(m=>m.classList.remove('show')); });

/* เริ่มทำงาน (เรียกท้ายสุด เพื่อให้ทุกฟังก์ชันถูกประกาศครบก่อน) */
boot();
</script>
</body>
</html>
